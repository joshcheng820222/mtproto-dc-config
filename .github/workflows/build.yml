name: build

on:
  schedule:
    - cron: '17 0 * * *'  # daily 00:17 UTC (08:17 CST)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install telethon pycryptodome
          sudo apt-get update -qq && sudo apt-get install -y -qq dnsutils

      - name: Generate
        run: python generate.py

      - name: Sanity check
        run: |
          python - << 'EOF'
          import json
          for f in ('mtproto-dc-config.json', 'mtproto-dc-config-ipv4.json'):
              cfg = json.load(open(f))
              opts = cfg['options']
              header, *rows = opts.strip().split('\n')
              n = int(header.split(']')[0][1:])
              assert n == len(rows), f"{f}: header {n} != rows {len(rows)}"
              assert n >= 15, f"{f}: only {n} options, refusing to publish"
              print(f, 'ok:', n, 'options')
          EOF

      - name: Commit & push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add mtproto-dc-config.json mtproto-dc-config-ipv4.json
          if git diff --cached --quiet; then
            echo "no changes"
          else
            git commit -m "Update MTProto DC config"
            git push
          fi
